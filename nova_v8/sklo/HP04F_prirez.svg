<text x="14.0" y="201.0" font-size="3">kontrola mierky tlače: 100 mm</text>
<text x="176.0" y="120.0" font-size="2.7" font-weight="bold">Postup (domáca dielňa):</text>
<text x="176.0" y="124.6" font-size="2.7">1. Objednať laserom rezaný prírez z LIATEHO dymového PMMA</text>
<text x="176.0" y="129.2" font-size="2.7">    2.0 mm (priepustnosť ~30–40 %). Extrudované PMMA sa pri</text>
<text x="176.0" y="133.8" font-size="2.7">    ohreve zmršťuje – najprv skúšobný kus, prípadne korekcia.</text>
<text x="176.0" y="138.4" font-size="2.7">2. Sušiť 1–2 h pri 80 °C (inak bubliny), fólie odstrániť.</text>
<text x="176.0" y="143.0" font-size="2.7">3. Rúra 150–160 °C, 4–8 min na papieri na pečenie,</text>
<text x="176.0" y="147.6" font-size="2.7">    kým nie je mäkký ako koža.</text>
<text x="176.0" y="152.2" font-size="2.7">4. Položiť stredom (modrá os) na formu R178, nechať</text>
<text x="176.0" y="156.8" font-size="2.7">    dosadnúť vlastnou váhou, len jemne pridržať v rohoch</text>
<text x="176.0" y="161.4" font-size="2.7">    (rukavice); chladnúť na forme 10 min.</text>
<text x="176.0" y="166.0" font-size="2.7">5. Masku nalepiť/nastriekať zvnútra (okno zakryť fóliou).</text>
<text x="176.0" y="170.6" font-size="2.7">6. Vlepiť do rámu HP03 na obojstrannú pásku 0.2 mm.</text>
<text x="176.0" y="175.2" font-size="2.7">Alternatíva: PC 0.75–1.0 mm za studena (R180 > 150×t),</text>
<text x="176.0" y="179.8" font-size="2.7">    drží ho zakrivená opierka rámu + páska 1 mm.</text>
<text x="176.0" y="184.39999999999998" font-size="2.7">Medzera k displeju: stred 6.3 mm, okraj DPS 1.0 mm.</text>
</svg>