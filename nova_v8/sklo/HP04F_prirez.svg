<text x="12" y="12" font-size="5.2" font-weight="bold">NOVA mini v8.1 – hlava A+ – krycie sklo HP04: prírez, maska, forma (mierka 1:1)</text>
<text x="12" y="18.5" font-size="3.2">Liate PMMA dymové 2.0 mm · valcový ohyb, zvislá os · R vonk. 180 / R vnút. = R formy 178 · rozvinuté na neutrálnej vrstve R 179 · tlač bez zmeny mierky (100 %)</text>
<text x="14.0" y="28.0" font-size="3.4" font-weight="bold">1  Prírez (laser, červená = rez)</text>
