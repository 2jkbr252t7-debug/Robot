<text x="14.0" y="201.0" font-size="3">kontrola mierky tlače: 100 mm</text>
<text x="176.0" y="116.0" font-size="2.7" font-weight="bold">Postup (domáca dielňa):</text>
<text x="176.0" y="120.4" font-size="2.7">1. Objednať laserom rezaný prírez z LIATEHO dymového PMMA</text>
<text x="176.0" y="124.8" font-size="2.7">    2.0 mm (priepustnosť ~30–40 %). Extrudované PMMA sa pri</text>
<text x="176.0" y="129.2" font-size="2.7">    ohreve zmršťuje – najprv skúšobný kus, prípadne korekcia.</text>
<text x="176.0" y="133.6" font-size="2.7">2. Sušiť 1–2 h pri 80 °C (inak bubliny), fólie odstrániť.</text>
<text x="176.0" y="138.0" font-size="2.7">3. Rúra 150–160 °C, 4–8 min na papieri na pečenie,</text>
<text x="176.0" y="142.4" font-size="2.7">    kým nie je mäkký ako koža.</text>
<text x="176.0" y="146.8" font-size="2.7">4. Položiť stredom (modrá os) na formu R178, nechať</text>
<text x="176.0" y="151.2" font-size="2.7">    dosadnúť vlastnou váhou, len jemne pridržať v rohoch</text>
<text x="176.0" y="155.6" font-size="2.7">    (rukavice); chladnúť na forme 10 min.</text>
<text x="176.0" y="160.0" font-size="2.7">5. Masku nalepiť/nastriekať zvnútra (okno zakryť fóliou).</text>
<text x="176.0" y="164.4" font-size="2.7">6. Vlepiť do zakriveného lôžka rámu HP03 (R177.8) na pásku</text>
<text x="176.0" y="168.8" font-size="2.7">    VHB 0.2 mm; čelo skla 0.3 mm pod čelom rámu (pôsobí zarovno).</text>
<text x="176.0" y="173.2" font-size="2.7">Alternatíva: PC 0.75–1.0 mm za studena (R180 > 150×t).</text>
<text x="176.0" y="177.60000000000002" font-size="2.7">Displej ostáva rovný na pene 0.5 mm (klin rámu = rovné lôžko);</text>
<text x="176.0" y="182.0" font-size="2.7">    vzduch k sklu: stred 5.7 mm, okraj LCD 0.6 mm</text>
<text x="176.0" y="186.4" font-size="2.7">    -> dotyk cez zakrivené sklo nefunguje (len zobrazenie).</text>
<text x="176.0" y="190.8" font-size="2.7">Žiadne skrutky ani otvory zvonku – modul drží na magnetoch</text>
<text x="176.0" y="195.2" font-size="2.7">    + 2× M2 zospodu (ako hlava A).</text>
</svg>