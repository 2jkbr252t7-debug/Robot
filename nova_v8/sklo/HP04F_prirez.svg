<text x="133.19491029214004" y="44.72000000000001" font-size="2.8" fill="#444">okno displeja 75.0 × 50.0 R2</text>
<text x="133.19491029214004" y="48.72000000000001" font-size="2.4" fill="#444">aktívna plocha 3.5" + 0.5 mm (ako hlava A)</text>
<text x="133.19491029214004" y="52.22000000000001" font-size="2.4" fill="#444">pás hore aj dole 4.7 mm, bočné 8.2 mm</text>
