<text x="215.3832402234637" y="31.4" font-size="2.4">VOLITEĽNÝ otvor kamery Ø3.6</text>
<text x="215.3832402234637" y="35.0" font-size="2.4">stred 3.2 od hornej hrany</text>
<text x="215.3832402234637" y="38.5" font-size="2.4">(bez kamery nevyrezať)</text>
<text x="215.3832402234637" y="44.0" font-size="2.4">symetrická – zvnútra</text>
<text x="215.3832402234637" y="47.5" font-size="2.4">sa nezrkadlí</text>
